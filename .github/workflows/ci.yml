name: CI
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags: '*'

concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }} - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1'   # last released version
        os:
          # personal-use fork: only ever installed locally on Apple Silicon
          - macos-latest   # Apple Silicon (arm64)
        arch:
          - aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: actions/cache@v4
        env:
          cache-name: cache-artifacts
        with:
          path: ~/.julia/artifacts
          key: ${{ runner.os }}-test-${{ env.cache-name }}-${{ hashFiles('**/Project.toml') }}
          restore-keys: |
            ${{ runner.os }}-test-${{ env.cache-name }}-
            ${{ runner.os }}-test-
            ${{ runner.os }}-
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        env:
          # `symlim`'s watchdog for a hung `SymbolicLimits` call runs the call on a
          # worker thread and gives up after `secs`. A hung Gruntz call is CPU-bound
          # and never yields, so on a SINGLE thread the watchdog starves and the
          # suite hangs instead of the route declining. The tests deliberately
          # exercise those paths -- the `1^inf` family reaches Gruntz on inputs that
          # do hang -- so the suite needs room for the watchdog to actually run.
          JULIA_NUM_THREADS: '4'
      - uses: julia-actions/julia-processcoverage@v1
